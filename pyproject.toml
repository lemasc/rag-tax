[project]
name = "rag-tax"
version = "0.1.0"
description = "RAG over Thai personal income tax sources"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
# crawl, extract and clean the corpus (crawler/)
crawler = [
    "crawler",
    "jupyter>=1.1.1",
    "marimo>=0.25.1",
    "lxml>=6.1.3",
    "trafilatura>=2.3.1",
    "urllib3>=2.8.0",
]
# corpus exploration: topic modeling, token statistics (analysis/)
analysis = [
    "pythainlp>=5.1",
    "scikit-learn>=1.5",
    "torch",
    "sentence-transformers>=3.0",
    "umap-learn>=0.5",
    "hdbscan>=0.8.40",
    "pandas>=3.0.6",
    "matplotlib>=3.11.2",
    "marimo>=0.25.1",
]
# retrieval baseline: chunking, dense and sparse indexes (rag/)
rag = [
    "pythainlp>=5.1",
    "scipy>=1.14",
    "torch",
    "sentence-transformers>=3.0",
    "openai>=3.35.1",
    "python-dotenv>=1.2.4",
    "streamlit>=1.40",
]
dev = ["pytest>=9.1.1"]

[tool.pytest.ini_options]
pythonpath = ["crawler/src", "."]

# driver supports CUDA 12.6 (nvidia-smi), so use the cu126 wheels rather than PyPI's default build
[tool.uv.sources]
torch = { index = "pytorch-cu126" }
crawler = { path = "crawler", editable = true }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
