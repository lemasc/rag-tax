# LLM backends and named model profiles for rag.llm. A run names profiles (`--gen gemma-31b --judge judge`); this
# file is the record of what each name meant, so change a profile's model only by adding a new profile.
#
# Backend: base_url (or base_url_env) and key_env, the .env variable holding the API key. `rpm` throttles requests
# per minute for rate-limited free APIs, shared by every profile on the backend's key; a profile's own `rpm` throttles
# that model only (OpenRouter limits per model), and both apply. Calls are spaced evenly, so 190/min is one call every
# 0.32 s, also under a 5-per-second limit. `json_mode` says whether the backend accepts response_format=json_object.
# Profile: backend, model id as the backend names it, and `params` passed to chat.completions.create unchanged
# (reasoning models reject temperature, so it is not set globally).
#
# Model ids marked TODO are filled in after `uv run python -m rag.llm models <backend>` lists what the key can see.
# Base URLs marked "unverified" come from vendor pages and have not been tried.

[backends.openai]
base_url = "https://api.openai.com/v1"
key_env = "OPENAI_API_KEY"
json_mode = true

[backends.openrouter]
base_url = "https://openrouter.ai/api/v1"
key_env = "OPENROUTER_API_KEY"
json_mode = true

[backends.typhoon]
base_url = "https://api.opentyphoon.ai/v1"  # unverified
key_env = "TYPHOON_API_KEY"
rpm = 190  # free tier (2026-10-23): 5 requests a second, 200 a minute; a little under, for clock jitter

[backends.thaillm]
base_url = "http://thaillm.or.th/api/v1"  # OpenAI-compatible (2026-10-23)
key_env = "THAILLM_API_KEY"
rpm = 190  # free tier (2026-10-23): 5 requests a second, 200 a minute

[backends.iapp]
base_url = "https://api.iapp.co.th/v3/llm/openthai2p0"  # unverified
key_env = "IAPP_API_KEY"
rpm = 25

[backends.ollama]
base_url_env = "OLLAMA_BASE_URL"
key = "ollama"  # Ollama ignores the key, the client needs one

# ---- profiles

[models.judge]  # fixed for the whole project: changing it invalidates earlier scores
backend = "openai"
# Undated alias (sizes: luna < terra < sol < astra); the API reports no snapshot, so judge every variant of an
# experiment in one session and record the date. Chosen 2026-10-20 over astra on cost; terra is the fallback.
model = "gpt-6-sol"
params = { reasoning_effort = "medium" }  # reasoning models reject temperature

[models.gpt-mini]  # development stand-in generator until OpenRouter/Thai keys exist; not reported (judge's family)
backend = "openai"
model = "gpt-6-luna"
params = { reasoning_effort = "low" }

# ---- Thai generators (2026-10-23): candidates for E3's fixed generator and E4, from families none of the judges is
# in. Typhoon's key lists only typhoon-v2.5-30b-a3b-instruct (typhoon-v2.1-12b-instruct: "Model not found"). The
# ThaiLLM models are fine-tunes of one 8B base by different groups; Pathumma (NECTEC), OpenThaiGPT and THaLLE (KBTG)
# keep the second generator away from Typhoon's vendor (SCB 10X, which also makes Typhoon-S-ThaiLLM). The ThaiLLM models
# reason in a <think> block inside the reply text; rag.answer cuts it before reading citations. Caps leave room for
# that; a reply cut off is asked again with twice the cap (rag.llm).
[models.typhoon]
backend = "typhoon"
model = "typhoon-v2.5-30b-a3b-instruct"
params = { temperature = 0, max_tokens = 2048 }

[models.pathumma]
backend = "thaillm"
model = "Pathumma-ThaiLLM-qwen3-8b-think-3.0.0"
params = { temperature = 0.6, max_tokens = 8192 }  # Qwen3 thinking models loop under greedy decoding

[models.pathumma-nothink]  # the same model with thinking turned off in its chat template
backend = "thaillm"
model = "Pathumma-ThaiLLM-qwen3-8b-think-3.0.0"
params = { temperature = 0.6, max_tokens = 2048, extra_body = { chat_template_kwargs = { enable_thinking = false } } }

[models.openthaigpt]
backend = "thaillm"
model = "OpenThaiGPT-ThaiLLM-8B-Instruct-v7.2"
params = { temperature = 0.6, max_tokens = 4096 }

[models.thalle]
backend = "thaillm"
model = "THaLLE-0.2-ThaiLLM-8B-fa"
params = { temperature = 0.6, max_tokens = 4096 }

# ---- candidate judges (2026-10-22), different families from the generators; compared with the human labels on the
# dev run before one is chosen for the panel. Undated aliases: judge every variant of an experiment in one session.
[models.judge-haiku]
backend = "openrouter"
model = "anthropic/claude-haiku-5.5"
params = { temperature = 0 }

[models.judge-gemini]
backend = "openrouter"
model = "google/gemini-3.8-flash"
params = { temperature = 0 }
rpm = 18  # a profile's rpm overrides its backend's; OpenRouter limits new accounts to 20/min on this model

[models.judge-deepseek]
backend = "openrouter"
model = "deepseek/deepseek-v4.1-flash"
params = { temperature = 0, max_tokens = 10000 }  # a reasoning model: one earlier call ran to 131,072 tokens; 10,000 is above the 99th percentile (9.8k) of 1,321 calls

# gpt-6-sol again, through OpenRouter (2026-10-23): finishes the pooled-ranking grades (rag.pooled) after the OpenAI credit
# ran out. Same model and reasoning effort as `judge`, but another route: the pairs it grades are marked in the notes of E1.
[models.judge-sol-or]
backend = "openrouter"
model = "openai/gpt-6-sol"
params = { reasoning_effort = "medium", max_tokens = 6000 }  # a small cap: the key's spend limit is checked against the largest possible reply
rpm = 18  # OpenRouter limits new accounts to 20 requests per minute on this model

# gpt-6-luna as a judge, through OpenRouter (2026-10-23): replaces sol in the panel from E1b on, to cut cost (about a
# twentieth of sol's price). Same family and reasoning effort as sol; checked against sol on the whole E1 pool before
# it is used (rag.judge_swap, plan: "Judge swap"). Not a generator from then on: it would grade its own answers.
[models.judge-luna-or]
backend = "openrouter"
model = "openai/gpt-6-luna"
params = { reasoning_effort = "medium", max_tokens = 6000 }
rpm = 18
